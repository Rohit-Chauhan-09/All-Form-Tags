<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <center>
    <table border="1" cellpadding="10" cellspacing="0">
        <tr>
            <td>
                    <font size="+5" color="red">Employee Resigration Form</font>
                    <form action="Manual_P2_Next.html" method="GET">
                        <br>
                        <table>
                            <tr>
                                <td></td>
                                <td>
                                    <input type="radio" id="mr" name="Mr" value="Mr">
                                    <label for="mr">Mr</label>
                                    <input type="radio" id="ms" name="Mr" value="Mr">
                                    <label for="ms">Ms</label>
                                    <input type="radio" id="mrs" name="Mr" value="Mr">
                                    <label for="mrs">Mrs</label>
                                </td>
                            </tr>
                            <br>
                            <tr>
                                <td>First Name:</td>
                                <td>
                                    <input autofocus type="text" name="firstname" placeholder="Enter your first name">
                                </td>
                            </tr>
                            <tr>
                                <td>Last Name:</td>
                                <td>
                                    <input type="text" name="lastname" placeholder="Enter your last name">
                                </td>
                            </tr>
                            <tr>
                                <td>Mail Address 1:</td>
                                <td>
                                    <input type="text" name="m1">
                                </td>
                            </tr>
                            <tr>
                                <td>Mail Address 2:</td>
                                <td>
                                    <input type="text" name="m2">
                                </td>
                            </tr>
                            <tr>
                                <td>City:</td>
                                <td>
                                    <input type="text" name="city">
                                </td>
                            </tr>
                            <tr>
                                <td>State:</td>
                                <td>
                                    <select>
                                        <option value="Maharashtra">Maharashtra</option>
                                        <option value="Uttar Pradesh">Uttar Pradesh</option>
                                        <option value="Chennai">Chennai</option>
                                        <option value="Bihar">Bihar</option>
                                    </select>
                                </td>
                            <tr>
                                <td>Zip:</td>
                                <td>
                                    <input type="text" name="zip">
                                </td>
                            </tr>
        </tr>
        <tr>
            <td>Upload Photo:</td>
            <td>
                <input type="file" name="Photo">
            </td>
        </tr>
        <tr>
            <td>E-mail:</td>
            <td>
                <input type="text" name="mail">
            </td>
        </tr>
        <tr>
            <td>Mobile No.</td>
            <td>
                <input type="text" name="mobile no" placeholder="+91">
            </td>
        <tr>
            <td>Languages Known</td>
            <td>
                <input type="checkbox" name="language" value="Gujrati">Gujrati
            </td>
        </tr>
        <tr>
            <td></td>
            <td>
                <input type="checkbox" name="language" value="Bhojpuri">Bhojpuri
            </td>
        </tr>
        <tr>
            <td></td>
            <td>
                <input type="checkbox" name="language" value="Marathi">Marathi
            </td>
        </tr>
        <tr>
            <td></td>
            <td>
                <input type="checkbox" name="language" value="Panjabi">Panjabi
            </td>
        </tr>
        <tr>
            <td></td>
            <td>
                <input type="checkbox" name="language" value="Tamil">Tamil
            </td>
        </tr>
        <tr>
            <td>Additional Information</td>
            <td>
                <textarea name="additional infomation" rows="3" cols="30" placeholder="Optional"></textarea>
            </td>
        </tr>
        <tr>
            <td></td>
            <td>
                <input type="submit" value="submit">
                <input type="reset" value="reset">
            </td>
        </tr>
    </table>
    </form>
    <h2 style="text-align: center;">Thank You</h2>
    <ul>
        <li><a href="">Click For Query</a></li>
    </ul>
    </center>
    </td>
    </tr>
    </table>
</body>

</html>
